<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login TSE Guatemala</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a3d62, #60a3bc);
      font-family: Inter, Arial, sans-serif;
      color: #fff;
    }
    .card {
      width: 320px;
      padding: 28px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(18px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
    }
    h1 {
      margin: 0 0 18px;
      font-size: 1.45rem;
      letter-spacing: 0.03em;
    }
    label {
      display: block;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }
    input, select {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 16px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }
    button {
      width: 100%;
      padding: 12px 14px;
      border: none;
      border-radius: 12px;
      background: #ffb142;
      color: #1e272e;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease;
    }
    button:hover {
      transform: translateY(-1px);
    }
    .note {
      margin-top: 16px;
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.8);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Login TSE Guatemala</h1>
    <form id="loginForm">
      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" type="text" placeholder="Ingrese su usuario" required>

      <label for="clave">Contraseña</label>
      <input id="clave" name="clave" type="password" placeholder="Ingrese su contraseña" required>

      <label for="rol">Rol</label>
      <select id="rol" name="rol" required>
        <option value="">Seleccionar rol</option>
        <option value="admin">Administrador</option>
        <option value="usuario">Usuario</option>
      </select>

      <button type="submit">Iniciar sesión</button>
    </form>
    <p class="note">Rol admin: acceso de gestión. Rol usuario: acceso de votación.</p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function(event) {
      event.preventDefault();
      var rol = document.getElementById('rol').value;
      if (!rol) {
        alert('Seleccione un rol válido.');
        return;
      }
      if (rol === 'admin') {
        alert('Bienvenido Administrador. Acceso al panel de gestión.');
      } else {
        alert('Bienvenido Usuario. Acceso al sistema de votación.');
      }
    });
  </script>
</body>
</html>
